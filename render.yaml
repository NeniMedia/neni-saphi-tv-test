# REVIEW ONLY. Applying this file creates an externally accessible service.
# Do not apply without explicit approval. Upload only the allowlisted package.
services:
  - type: web
    name: nenitv
    runtime: python
    region: frankfurt
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT --timeout 60 --max-requests 2000 --max-requests-jitter 100 --forwarded-allow-ips '*' app:application
    healthCheckPath: /healthz
    envVars:
      - key: TEST_ENABLED
        value: 'false'
      - key: TEST_HOST
        sync: false
      - key: TEST_EXPIRES_AT
        sync: false
      - key: TEST_PIN_SALT
        sync: false
      - key: TEST_PIN_HASH
        sync: false
